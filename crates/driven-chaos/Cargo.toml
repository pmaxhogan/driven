[package]
name = "driven-chaos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Driven stress / chaos harness; see design/STRESS_HARNESS.md"
publish = false

[[bin]]
name = "driven-chaos"
path = "src/main.rs"

[dependencies]
# Headless core + seams. The harness boots the core directly (DESIGN s4.2
# thick-core / thin-shell split); it does NOT depend on src-tauri.
driven-core = { path = "../driven-core" }
driven-drive = { path = "../driven-drive" }
# The S3 backend under test. The s3.9 rows drive the REAL `S3Store` (real
# signing, real reqwest round trips, real `classify_s3_response`) against the
# in-process fault-injecting server in `s3_server.rs` - injecting an
# already-classified error at the trait seam would prove nothing about the wire
# quirks (503 SlowDown, RequestTimeout-as-400, a 200 carrying an error
# document) that only exist below it.
driven-s3 = { path = "../driven-s3" }
# The local-folder backend under test. Unlike the HTTP backends its destination
# IS a directory, so the s3.9 local-folder rows construct post-crash on-disk
# states (an abandoned temp file, a rename that cannot land, a marker belonging
# to a different volume) byte-for-byte rather than modelling them.
driven-localfs = { path = "../driven-localfs" }
# `S3Store::new` takes the shared custom-CA + proxy config (issue #34); the
# harness passes the "none / system" pair.
driven-tls = { path = "../driven-tls" }
# The backend-neutral `RemoteStore` trait + `DriveError` taxonomy the s3.9 rows
# assert against directly.
driven-remote = { path = "../driven-remote" }
driven-crypto = { path = "../driven-crypto" }
driven-power = { path = "../driven-power" }
driven-test-fixtures = { path = "../driven-test-fixtures" }
# Host capability probe (P1-A): reuse the elevation-token check rather than
# re-deriving it. driven-vss carries no driven-core dep, so this stays acyclic.
driven-vss = { path = "../driven-vss" }

anyhow.workspace = true
async-trait.workspace = true
# Upload bodies at the `RemoteStore` seam are `Bytes`; the s3.9 rows that assert
# the trait contract directly (rather than only through the orchestrator) need
# them.
bytes.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
# The huge-file rows (P1-B) verify by length + md5 against the fake's content
# oracle instead of buffering / downloading 10-50 GB; same md-5 crate the core
# + fake use, imported as `md5`.
md5.workspace = true
# Central s6.3 content-integrity invariant: hash a synced object's retained
# bytes to the recorded plaintext blake3 (same crate + version the core uses).
blake3 = "1"
# Hermetic per-scenario StateRepo files live under a throwaway tempdir.
tempfile = "3"

# Capability probe (P1-A) free-disk + NTFS volume detection.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
] }

# Capability probe (P1-A) free-disk via statvfs on Unix.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
