[package]
name = "driven-backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Driven backup-destination factory: builds the RemoteStore for an account's configured backend"
publish = false

[dependencies]
# The trait + the `BackendKind` taxonomy the factory dispatches on.
driven-remote = { path = "../driven-remote" }
# The Google Drive backend (the historical default destination).
driven-drive = { path = "../driven-drive" }
# The S3-compatible backend (AWS S3, R2, MinIO, B2, ...).
driven-s3 = { path = "../driven-s3" }
# The local / removable-folder backend (USB drives, NAS mounts, restore drills).
driven-localfs = { path = "../driven-localfs" }
# Corporate custom-CA + proxy config, threaded into every client the factory
# builds (issue #34).
driven-tls = { path = "../driven-tls" }
anyhow.workspace = true
tracing.workspace = true

[dev-dependencies]
# `driven_test_fixtures::keychain::isolated()` installs (and PROVES) an
# in-memory credential store as the process default, so the keychain-backed
# paths here - the factory's Drive arm, the BYO client-creds resolution - are
# covered by real tests that never reach an OS keychain: neither the
# developer's login keychain (which on macOS re-prompts on every rebuild) nor a
# headless CI box's absent one. Dev-only: production always uses the real
# per-OS store.
driven-test-fixtures = { path = "../driven-test-fixtures" }
# The local-folder tests need a throwaway destination directory.
tempfile = "3"
