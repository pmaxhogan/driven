[package]
name = "driven-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Driven debugging CLI - auth / dump-refresh-token / sync without the GUI (ROADMAP M4)"
publish = false

[[bin]]
name = "driven-cli"
path = "src/main.rs"

[dependencies]
driven-core = { path = "../driven-core" }
driven-drive = { path = "../driven-drive" }
# `restore` builds the account's REAL destination store through the SAME
# factory the desktop app uses, so a Google Drive / S3 / local-folder account
# all work and the secret comes from the same keychain entry. Duplicating the
# construction chain here would be the third copy of it.
driven-backend = { path = "../driven-backend" }
driven-net = { path = "../driven-net" }
driven-crypto = { path = "../driven-crypto" }
driven-power = { path = "../driven-power" }
# `rclone list` / `rclone import`: parses an existing rclone.conf and renders
# the Driven settings. All the logic (and its tests) live in the crate; the CLI
# is a `println!` over it, which is why no `serde` dependency appears here.
driven-rclone = { path = "../driven-rclone" }
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
# `tests/restore_e2e.rs` drives the REAL upload pipeline into a local-folder
# destination, then runs the shipped binary against the resulting state.db. It
# needs the executor's seams: a `BoxFuture` outcome sink and an `#[async_trait]`
# pass-through pacer.
futures.workspace = true
async-trait.workspace = true
