# Dependabot config (M9 tail, task #10). Keeps the four real dependency
# ecosystems patched on a weekly cadence with a small, grouped PR footprint.
#
# Conventions:
# - Weekly schedule (Monday) - a single-maintainer cadence, not a daily flood.
# - Minor + patch updates are GROUPED into one PR per ecosystem so routine bumps
#   land together; MAJOR updates open their own PR (they may need code changes).
# - open-pull-requests-limit is kept low so the queue never overwhelms review.
# - All PRs target the default branch (main) and use Conventional-Commits-style
#   prefixes so they match the repo's commit history.
version: 2
updates:
  # Rust workspace (root Cargo.toml + all member crates + src-tauri).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
    ignore:
      # keyring 4.1.6 regressed: it caches the first native-store failure
      # forever, defeating the in-memory test-store latch and panicking
      # the_test_suite_is_isolated_from_the_os_keychain on headless CI
      # (no Secret Service). Pinned back in #298; drop this ignore once a
      # release fixes the LazyLock latch upstream.
      - dependency-name: keyring
        versions: ["4.1.6"]
      # tauri-plugin-deep-link 2.6.2 does not compile on Linux: it builds
      # ini::ParseOption with two fields, but rust-ini 0.21.3 (the only
      # non-yanked 0.21 that has it) requires four. Pinned to 2.6.1 in #343;
      # drop this ignore once a fixed release ships.
      - dependency-name: tauri-plugin-deep-link
        versions: ["2.6.2"]
      # windows-core must stay on the same line as the `windows` crate:
      # driven-vss's `windows::core::interface` COM impls mix the two, and
      # windows 0.62.2 (latest) pins windows-core ^0.62. windows-core 0.100
      # (#353) split them and broke the Windows build. Drop this once a
      # matching `windows` release ships and bump both together.
      - dependency-name: windows-core
        versions: [">= 0.63"]
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  # Vue/Vite frontend (ui/).
  - package-ecosystem: npm
    directory: "/ui"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
    groups:
      ui-minor-patch:
        update-types:
          - minor
          - patch

  # Cloudflare telemetry worker (telemetry-worker/).
  - package-ecosystem: npm
    directory: "/telemetry-worker"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
    groups:
      telemetry-worker-minor-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions used by the workflows in .github/workflows/.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
